
name: DevSecOps Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install application dependencies
        run: pip install -r Experiment4_DevSecOps/requirements.txt

      - name: Python dependency security audit
        run: |
          pip install pip-audit
          pip-audit -r Experiment4_DevSecOps/requirements.txt

      - name: Trivy filesystem security scan
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/Experiment4_DevSecOps:/project" \
            aquasec/trivy:latest \
            fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --format table \
            --exit-code 1 \
            /project
