---
- name: Configure and automate web application
  hosts: webservers
  become: false

  tasks:
    - name: Create application directory
      ansible.builtin.file:
        path: /workspace/ansible_app
        state: directory
        mode: '0755'

    - name: Deploy application homepage
      ansible.builtin.copy:
        dest: /workspace/ansible_app/index.html
        content: |
          <html>
          <head><title>DevOps Ansible</title></head>
          <body>
          <h1>Application deployed using Ansible</h1>
          <p>Infrastructure automation practical</p>
          </body>
          </html>
        mode: '0644'

    - name: Create application configuration
      ansible.builtin.copy:
        dest: /workspace/ansible_app/config.txt
        content: |
          Application: DevOps Demo
          Environment: Production
          Managed By: Ansible
        mode: '0644'

    - name: Display completion message
      ansible.builtin.debug:
        msg: "Application configuration completed successfully!"
